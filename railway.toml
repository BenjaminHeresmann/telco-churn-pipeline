[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Sin startCommand: usa el CMD del Dockerfile, que expande $PORT via 'sh -c'.
# (Railway ejecuta startCommand sin shell, por eso $PORT no se expandiria aqui.)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 100
