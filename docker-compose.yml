services:
  postgres:
    image: postgres:15-alpine
    container_name: telco_churn_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telco_churn}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline_user} -d ${POSTGRES_DB:-telco_churn}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    container_name: telco_churn_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-telco_churn}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
      SOURCE_CSV_PATH: /app/data/source/telco_churn.csv
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - "../0.CASOS_PARCIALES_Evaluaciones-2y3/01_Telco Customer Churn:/app/data/source:ro"
    profiles:
      - run

volumes:
  postgres_data:
    driver: local
